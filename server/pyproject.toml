[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "liquidity-gate-mcp"
version = "0.1.0"
description = "Local-first MCP server for Liquidity Gate household cash-flow reconstruction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12.4,<2.0.0",
  "pydantic>=2.9.2,<3.0.0",
  "watchdog>=6.0.0,<7.0.0"
]

[project.scripts]
liquidity-gate-mcp = "liquidity_gate_mcp.server:main"
refresh-hysa-gate = "liquidity_gate_mcp.computed_balance:main"

[tool.hatch.build.targets.wheel]
packages = ["src/liquidity_gate_mcp"]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
